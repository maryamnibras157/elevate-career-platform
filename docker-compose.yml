services:
  postgres:
    image: postgres:16-alpine
    container_name: crs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crs_user
      POSTGRES_PASSWORD: crs_password
      POSTGRES_DB: crs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crs_user -d crs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crs_backend
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://crs_user:crs_password@postgres:5432/crs_db
      DATABASE_URL_SYNC: postgresql://crs_user:crs_password@postgres:5432/crs_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crs_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:9000
      NODE_ENV: production
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: crs_network